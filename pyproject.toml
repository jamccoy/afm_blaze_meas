[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-blaze-meas"
version = "0.2.0"
description = "Blaze angle measurement and PCGrate boundary profiles from AFM scans of diffraction gratings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jake McCoy" }]
keywords = ["afm", "diffraction", "grating", "blaze", "metrology", "pcgrate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# The Qt front-end only. Deliberately not a core dependency: computing blaze
# angles or exporting a .ggp should never require a GUI toolkit, and this
# package is BSD-3 -- an optional, dynamically-linked LGPL dependency keeps it
# that way.
#
# PySide6 (LGPLv3) rather than PyQt5/PyQt6 (GPL). The previous requirements.txt
# listed PyQt5 as a hard requirement, which put GPL code in the install path of
# anyone who only wanted the analysis.
#
# PySide6-Essentials rather than the PySide6 meta-package: the Addons
# (WebEngine, Multimedia, 3D) are hundreds of megabytes this window never
# touches. Essentials still carries QtSvg, which matplotlib's Qt shim imports
# unconditionally.
gui = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=7", "pytest-qt>=4.5"]

[project.scripts]
afm-analysis = "afm_analysis.cli:main"
# Points at gui, not gui.qt.app: gui.main calls require_qt() first, so a missing
# toolkit produces the install instruction rather than a bare ModuleNotFoundError
# naming a package the user never asked for.
afm-gui = "afm_analysis.gui:main"

[project.urls]
Homepage = "https://github.com/jamccoy/afm_blaze_meas"

[tool.setuptools.packages.find]
where = ["src"]

# The wiki pages are prose the application displays, so they must travel with an
# installed copy rather than existing only in a checkout. Without this they are
# silently absent from a wheel and the Wiki tab is empty for anyone who pip
# installed rather than cloned.
[tool.setuptools.package-data]
"afm_analysis.wiki" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
